<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="resource/favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>批量创建代金券 - 美妆管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css" />
  <style>
    :root {
      --color-primary: #C4845A;
      --color-primary-light: #D9A882;
      --color-primary-dark: #A8694A;
      --color-primary-muted: #F0D5C5;
      --color-accent: #E8C9A8;
      --color-gold: #BFA080;
      --color-bg-base: #FDFAF8;
      --color-bg-warm: #F5EDE8;
      --color-bg-section: #FAF6F3;
      --color-bg-overlay: rgba(196, 132, 90, 0.06);
      --color-text-primary: #2C2320;
      --color-text-secondary: #6B5E58;
      --color-text-muted: #A89690;
      --color-text-on-primary: #FDFAF8;
      --color-text-link: #C4845A;
      --color-border-light: #EDE3DC;
      --color-border-medium: #D9CBBE;
      --color-border-focus: #C4845A;
      --color-success: #7BAF8A;
      --color-success-bg: #EEF5F0;
      --color-danger: #B86A6A;
      --color-danger-bg: #F7EDED;
      --shadow-xs: 0 1px 2px rgba(44, 35, 32, 0.05);
      --shadow-sm: 0 2px 8px rgba(44, 35, 32, 0.07);
      --shadow-nav: 0 1px 0 #EDE3DC;
      --font-display: 'Cormorant Garamond', 'SimSun', serif;
      --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --duration-fast: 150ms;
      --duration-normal: 250ms;
      --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      font-family: var(--font-body);
    }

    body {
      background-color: var(--color-bg-base);
      color: var(--color-text-primary);
    }

    /* ── 侧边栏 ── */
    .sidebar {
      width: 220px;
      background: #2C2320;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-logo {
      height: 64px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-bottom: 1px solid rgba(253, 250, 248, 0.08);
    }

    .sidebar-logo-sub {
      font-size: 10px;
      color: rgba(253, 250, 248, 0.45);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .sidebar-logo-name {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 400;
      color: var(--color-gold);
      letter-spacing: 0.08em;
      margin-top: 2px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 4px;
      border-left: 3px solid transparent;
      font-size: 13px;
      color: rgba(253, 250, 248, 0.75);
      text-decoration: none;
      margin-bottom: 2px;
      transition: background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
    }

    .nav-item:hover {
      background: rgba(253, 250, 248, 0.06);
      color: #FDFAF8;
    }

    .nav-item.active {
      background: rgba(196, 132, 90, 0.18);
      color: var(--color-primary-muted);
      border-left-color: var(--color-primary);
    }

    .nav-item svg {
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid rgba(253, 250, 248, 0.08);
    }

    .sidebar-user-name {
      font-size: 11px;
      color: rgba(253, 250, 248, 0.45);
      margin-bottom: 6px;
    }

    .logout-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(253, 250, 248, 0.55);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color var(--duration-fast) var(--ease-out);
    }

    .logout-btn:hover {
      color: #FDFAF8;
    }

    /* ── Topbar ── */
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--color-border-light);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: var(--shadow-nav);
    }

    .topbar-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-primary);
    }

    /* ── 按钮 ── */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      padding: 0 24px;
      background: var(--color-primary);
      color: var(--color-text-on-primary);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(196, 132, 90, 0.28);
      transition: all var(--duration-normal) var(--ease-out);
    }

    .btn-primary:hover {
      background: var(--color-primary-light);
      box-shadow: 0 4px 12px rgba(196, 132, 90, 0.40);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      background: var(--color-primary-dark);
      transform: translateY(0) scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 24px;
      background: transparent;
      color: var(--color-primary);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      border: 1.5px solid var(--color-primary);
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--duration-normal) var(--ease-out);
    }

    .btn-secondary:hover {
      background: var(--color-primary-muted);
    }

    /* ── 输入框 ── */
    .input-field {
      width: 100%;
      height: 40px;
      background: #fff;
      border: 1.5px solid var(--color-border-light);
      border-radius: 4px;
      padding: 0 14px;
      font-size: 14px;
      font-family: var(--font-body);
      color: var(--color-text-primary);
      box-shadow: var(--shadow-xs);
      transition: border-color var(--duration-normal) var(--ease-out), box-shadow var(--duration-normal) var(--ease-out);
      outline: none;
      box-sizing: border-box;
    }

    .input-field::placeholder {
      color: var(--color-text-muted);
    }

    .input-field:focus {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px rgba(196, 132, 90, 0.12);
    }

    /* ── 表单卡片 ── */
    .form-card {
      background: #fff;
      border: 1px solid var(--color-border-light);
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 1px 4px rgba(44, 35, 32, 0.06);
      max-width: 480px;
    }

    .form-card-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: 6px;
    }

    .form-required {
      color: var(--color-danger);
    }

    .form-hint {
      font-size: 11px;
      color: var(--color-text-muted);
      margin-top: 4px;
    }

    .form-footer {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    .form-footer .btn-primary,
    .form-footer .btn-secondary {
      flex: 1;
    }

    /* ── 错误提示 ── */
    .error-box {
      background: var(--color-danger-bg);
      border: 1px solid #E8B0B0;
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--color-danger);
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="flex h-screen">

    <!-- ── 侧边栏 ── -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-sub">Admin</div>
        <div class="sidebar-logo-name">美妆销售系统</div>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          首页
        </a>
        <a href="products.html" class="nav-item">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
          </svg>
          商品管理
        </a>
        <a href="brands.html" class="nav-item">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
          </svg>
          品牌管理
        </a>
        <a href="tags.html" class="nav-item">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14" />
          </svg>
          标签管理
        </a>
        <a href="orders.html" class="nav-item">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          订单管理
        </a>
        <a href="vouchers.html" class="nav-item active">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
          </svg>
          代金券
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-name" id="sidebar-user"></div>
        <button onclick="authLogout()" class="logout-btn">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          退出登录
        </button>
      </div>
    </aside>

    <!-- ── 主内容 ── -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <header class="topbar">
        <h1 class="topbar-title">批量创建代金券</h1>
      </header>

      <main class="flex-1 overflow-auto" style="padding: 32px 24px; background: var(--color-bg-base);">
        <div id="error-box" class="error-box"></div>
        <div class="form-card">
          <h2 class="form-card-title">创建信息</h2>

          <div class="form-group">
            <label class="form-label" for="f-amount">面额（元）<span class="form-required">*</span></label>
            <input id="f-amount" type="number" min="0.01" step="0.01" placeholder="如：50.00" class="input-field" />
          </div>

          <div class="form-group">
            <label class="form-label" for="f-quantity">数量 <span class="form-required">*</span></label>
            <input id="f-quantity" type="number" min="1" max="100" placeholder="1 - 100" class="input-field" />
            <p class="form-hint">单次最多创建 100 张</p>
          </div>

          <div class="form-group">
            <label class="form-label" for="f-start">有效期开始 <span class="form-required">*</span></label>
            <input id="f-start" type="date" class="input-field" />
          </div>

          <div class="form-group">
            <label class="form-label" for="f-end">有效期截止 <span class="form-required">*</span></label>
            <input id="f-end" type="date" class="input-field" />
          </div>

          <div class="form-footer">
            <a href="vouchers.html" class="btn-secondary">取消</a>
            <button id="submit-btn" onclick="submitCreate()" class="btn-primary">创建</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    requireAuth();
    document.getElementById('sidebar-user').textContent = getAdminUser();

    // 默认填入今天
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('f-start').value = today;

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = msg;
      box.style.display = 'block';
    }
    function hideError() {
      document.getElementById('error-box').style.display = 'none';
    }

    async function submitCreate() {
      hideError();
      const amount = parseFloat(document.getElementById('f-amount').value);
      const quantity = parseInt(document.getElementById('f-quantity').value, 10);
      const start = document.getElementById('f-start').value;
      const end = document.getElementById('f-end').value;

      if (!amount || amount <= 0) { showError('面额必须大于 0'); return; }
      if (!quantity || quantity < 1 || quantity > 100) { showError('数量必须在 1-100 之间'); return; }
      if (!start) { showError('请选择有效期开始日期'); return; }
      if (!end) { showError('请选择有效期截止日期'); return; }
      if (end < start) { showError('截止日期必须 >= 开始日期'); return; }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = '创建中...';

      try {
        const result = await api.post('/vouchers/batch', {
          amount,
          quantity,
          start_date: start,
          end_date: end,
        });
        // 跳转到列表页并展示成功消息
        window.location.href = `vouchers.html?batch_no=${encodeURIComponent(result.batch_no)}`;
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = '创建';
      }
    }
  </script>
</body>

</html>
