<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="resource/favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>购物车 - 美妆精选</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts（附录 B）-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/custom.css" />

  <style>
    /* ══ CSS 变量（附录 A）══════════════════════════════ */
    :root {
      --color-primary: #C4845A;
      --color-primary-light: #D9A882;
      --color-primary-dark: #A8694A;
      --color-primary-muted: #F0D5C5;
      --color-accent: #E8C9A8;
      --color-gold: #BFA080;
      --color-bg-base: #FDFAF8;
      --color-bg-warm: #F5EDE8;
      --color-bg-section: #FAF6F3;
      --color-bg-overlay: rgba(196, 132, 90, 0.06);
      --color-text-primary: #2C2320;
      --color-text-secondary: #6B5E58;
      --color-text-muted: #A89690;
      --color-text-on-primary: #FDFAF8;
      --color-text-link: #C4845A;
      --color-border-light: #EDE3DC;
      --color-border-medium: #D9CBBE;
      --color-border-focus: #C4845A;
      --color-success: #7BAF8A;
      --color-success-bg: #EEF5F0;
      --color-warning: #C9935A;
      --color-warning-bg: #FBF2EA;
      --color-danger: #B86A6A;
      --color-danger-bg: #F7EDED;
      --color-info: #7A9BB5;
      --color-info-bg: #EEF3F8;
      --shadow-xs: 0 1px 2px rgba(44, 35, 32, 0.05);
      --shadow-sm: 0 2px 8px rgba(44, 35, 32, 0.07);
      --shadow-md: 0 4px 16px rgba(44, 35, 32, 0.10);
      --shadow-lg: 0 8px 32px rgba(44, 35, 32, 0.12);
      --shadow-nav: 0 1px 0 #EDE3DC;
      --font-display: 'Cormorant Garamond', 'SimSun', serif;
      --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --duration-fast: 150ms;
      --duration-normal: 250ms;
      --duration-slow: 400ms;
      --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-in-out: cubic-bezier(0.4, 0, 0.6, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ══ 页面进场动效 ══════════════════════════════════ */
    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateX(16px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-bg-base);
      color: var(--color-text-primary);
      animation: pageEnter 300ms var(--ease-out) both;
    }

    /* ══ 购物车角标弹动 ════════════════════════════════ */
    @keyframes badgePop {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.4);
      }

      70% {
        transform: scale(0.9);
      }

      100% {
        transform: scale(1);
      }
    }

    .cart-badge.updated {
      animation: badgePop 300ms var(--ease-spring);
    }

    /* ══ 购物车卡片条目：淡入上浮 ═════════════════════ */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #cart-list>.card {
      animation: fadeInUp 400ms var(--ease-out) both;
    }

    #cart-list>.card:nth-child(1) {
      animation-delay: 0ms;
    }

    #cart-list>.card:nth-child(2) {
      animation-delay: 60ms;
    }

    #cart-list>.card:nth-child(3) {
      animation-delay: 120ms;
    }

    #cart-list>.card:nth-child(4) {
      animation-delay: 180ms;
    }

    #cart-list>.card:nth-child(5) {
      animation-delay: 240ms;
    }

    #cart-list>.card:nth-child(n+6) {
      animation-delay: 300ms;
    }

    /* ══ 合计金额：--font-display 数字更有质感 ════════ */
    #total-amount {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--color-primary);
      letter-spacing: 0.02em;
    }

    /* ══ 导航栏标题：--font-body ══════════════════════ */
    .nav-title {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--color-text-primary);
    }

    /* ══ 清空按钮（文字按钮）══════════════════════════ */
    #clear-btn {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 400;
      color: var(--color-text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px 4px;
      transition: color var(--duration-fast) ease;
    }

    #clear-btn:hover {
      color: var(--color-danger);
      text-decoration: underline;
    }

    /* ══ 底部结算栏 ════════════════════════════════════ */
    .checkout-bar {
      background-color: #FFFFFF;
      border-top: 1px solid var(--color-border-light);
      box-shadow: 0 -2px 12px rgba(44, 35, 32, 0.06);
    }

    /* （联系我们 Modal 样式已合并至 custom.css）*/
  </style>
</head>

<body class="min-h-screen">

  <!-- ── 顶部导航（sticky，毛玻璃）── -->
  <div class="sticky top-0 z-20 nav-bar">
    <div class="flex items-center px-5 h-14 gap-3">
      <a href="index.html" class="p-1.5 -ml-1.5 rounded" style="color:var(--color-primary);" aria-label="返回">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7" />
        </svg>
      </a>
      <span class="nav-title flex-1">购物车</span>
      <button onclick="openContact()" class="p-2 rounded" style="color:var(--color-primary);" aria-label="联系我们" title="联系我们">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
      </button>
      <button id="clear-btn">清空</button>
    </div>
  </div>

  <!-- ── 主体内容区 ── -->
  <main class="px-4 pt-3 pb-36">

    <!-- 商品列表（由 cart.js 渲染）-->
    <div id="cart-list"></div>

    <!-- 空购物车状态 -->
    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-24">
      <svg class="w-16 h-16 mb-4" style="color:var(--color-primary-light);opacity:0.45;" fill="none"
        stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184
             1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
      <p class="text-sm mb-5" style="color:var(--color-text-muted);font-family:var(--font-body);">购物车是空的</p>
      <a href="index.html" class="btn-primary text-sm px-6 py-2.5">去选购</a>
    </div>

  </main>

  <!-- ── 底部结算栏（fixed）── -->
  <div class="fixed bottom-0 left-0 right-0 z-10 checkout-bar">
    <div class="flex items-center justify-between px-5 py-3">
      <div class="flex flex-col">
        <span class="text-xs"
          style="color:var(--color-text-muted);font-family:var(--font-body);letter-spacing:0.06em;">合计</span>
        <span id="total-amount">¥0.00</span>
      </div>
      <button id="checkout-btn" class="btn-primary text-sm px-7 py-3 tracking-wider" disabled>去提交订单</button>
    </div>
    <!-- iPhone 底部安全区 -->
    <div style="height: env(safe-area-inset-bottom, 0px);"></div>
  </div>

  <!-- ── Toast ── -->
  <div id="toast" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

  <!-- ── 联系我们 Modal ── -->
  <div id="contact-modal" class="contact-overlay" style="display:none;" onclick="if(event.target===this)closeContact()">
    <div class="contact-card">
      <!-- 标题栏 -->
      <div class="contact-card-header">
        <div>
          <div class="contact-card-title">Contact Us</div>
          <div class="contact-card-hint">扫码联系 · 了解更多</div>
        </div>
        <button class="contact-close-btn" onclick="closeContact()" aria-label="关闭">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="1" y1="1" x2="10" y2="10"/><line x1="10" y1="1" x2="1" y2="10"/>
          </svg>
        </button>
      </div>
      <!-- 图片 Gallery -->
      <div class="contact-gallery-wrap" id="contact-gallery-wrap">
        <div class="contact-gallery-track" id="contact-gallery-track">
          <img src="resource/1.jpg" alt="联系方式" />
          <img src="resource/2.jpg" alt="联系方式" />
          <img src="resource/3.jpg" alt="联系方式" />
        </div>
        <button class="contact-nav-btn prev" id="contact-nav-prev" onclick="contactGalleryMove(-1)" aria-label="上一张">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <button class="contact-nav-btn next" id="contact-nav-next" onclick="contactGalleryMove(1)" aria-label="下一张">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
      <!-- 指示点 -->
      <div class="contact-dots-row" id="contact-dots-row">
        <span class="contact-dot active"></span>
        <span class="contact-dot"></span>
        <span class="contact-dot"></span>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script>
    /* ── 联系我们 Modal ── */
    (function () {
      var _idx = 0, _TOTAL = 3, _swipeX = 0;

      window.openContact = function () {
        _idx = 0;
        _render();
        var el = document.getElementById('contact-modal');
        el.classList.remove('contact-closing');
        el.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        var wrap = document.getElementById('contact-gallery-wrap');
        if (wrap && !wrap._swipeReady) {
          wrap._swipeReady = true;
          wrap.addEventListener('touchstart', function (e) { _swipeX = e.touches[0].clientX; }, { passive: true });
          wrap.addEventListener('touchend', function (e) {
            var dx = e.changedTouches[0].clientX - _swipeX;
            if (Math.abs(dx) > 40) window.contactGalleryMove(dx < 0 ? 1 : -1);
          }, { passive: true });
        }
      };

      window.closeContact = function () {
        var el = document.getElementById('contact-modal');
        el.classList.add('contact-closing');
        setTimeout(function () {
          el.style.display = 'none';
          el.classList.remove('contact-closing');
          document.body.style.overflow = '';
        }, 200);
      };

      window.contactGalleryMove = function (dir) {
        _idx = Math.max(0, Math.min(_TOTAL - 1, _idx + dir));
        _render();
      };

      function _render() {
        var track = document.getElementById('contact-gallery-track');
        if (track) track.style.transform = 'translateX(-' + (_idx * 100) + '%)';
        document.querySelectorAll('#contact-dots-row .contact-dot').forEach(function (d, i) {
          d.classList.toggle('active', i === _idx);
        });
        var prev = document.getElementById('contact-nav-prev');
        var next = document.getElementById('contact-nav-next');
        if (prev) prev.disabled = _idx === 0;
        if (next) next.disabled = _idx === _TOTAL - 1;
      }

      document.addEventListener('keydown', function (e) {
        var modal = document.getElementById('contact-modal');
        if (!modal || modal.style.display === 'none') return;
        if (e.key === 'Escape') window.closeContact();
        else if (e.key === 'ArrowLeft')  window.contactGalleryMove(-1);
        else if (e.key === 'ArrowRight') window.contactGalleryMove(1);
      });
    })();
  </script>
</body>

</html>
